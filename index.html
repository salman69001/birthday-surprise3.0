<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Playfair Display', serif;
      background-color: #fceee9;
    }

    .stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: opacity 0.8s ease;
    }

    .hidden {
      display: none !important;
    }

    /* STAGE 1: ARCHERY */
    #stage1 {
      background: radial-gradient(circle at 50% 35%, #fbdada 0%, #fceee9 75%);
    }

    .subtitle-top {
      margin-top: 5vh;
      font-style: italic;
      color: #8b5d5d;
      font-size: clamp(0.9rem, 4vw, 1.1rem);
      letter-spacing: 1px;
    }

    .target-container {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .target-aura {
      position: absolute;
      width: clamp(140px, 45vw, 200px);
      height: clamp(140px, 45vw, 200px);
      background: radial-gradient(circle, rgba(230, 0, 92, 0.25) 0%, rgba(255,182,193,0) 70%);
      border-radius: 50%;
      animation: pulse 2.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 0.3; }
    }

    .main-heart-target {
      width: clamp(80px, 25vw, 110px);
      height: clamp(80px, 25vw, 110px);
      position: relative;
      filter: drop-shadow(0 12px 20px rgba(180, 40, 60, 0.4));
    }

    .instruction-bottom {
      position: absolute;
      bottom: 4vh;
      text-align: center;
      pointer-events: none;
    }

    .pull-text {
      font-size: clamp(0.75rem, 3vw, 0.85rem);
      letter-spacing: 3px;
      color: #a06d6d;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .action-text {
      font-size: clamp(1.4rem, 6vw, 1.8rem);
      color: #2b1e1e;
      font-weight: 700;
    }

    /* INTERACTIVE BOW & ARROW */
    .archery-interactive {
      position: absolute;
      bottom: 15vh;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(180px, 50vw, 220px);
      height: clamp(200px, 55vw, 240px);
      z-index: 50;
      touch-action: none;
      cursor: grab;
    }

    .archery-interactive:active {
      cursor: grabbing;
    }

    /* STAGE 2: HAPPY BIRTHDAY BANNER */
    #stage2 {
      background: linear-gradient(135deg, #a80038 0%, #680023 100%);
      color: #ffffff;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .s2-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      animation: fadeIn 1.2s ease;
      width: 90%;
      max-width: 500px;
    }

    .s2-wish {
      font-style: italic;
      font-size: clamp(1rem, 4vw, 1.2rem);
      opacity: 0.9;
      letter-spacing: 1px;
    }

    .s2-title {
      font-size: clamp(3rem, 12vw, 4.8rem);
      font-weight: 700;
      line-height: 1.05;
      text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    .s2-divider {
      width: 120px;
      height: 3px;
      background: #e2a85c;
      border-radius: 2px;
      margin: 8px 0;
    }

    .s2-subtext {
      font-style: italic;
      font-size: clamp(0.95rem, 3.8vw, 1.15rem);
      opacity: 0.85;
    }

    .btn-next {
      margin-top: 30px;
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-family: inherit;
      font-size: clamp(0.95rem, 3.5vw, 1.05rem);
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .btn-next:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* STAGE 3: BLOOMING TREE */
    #stage3 {
      background: radial-gradient(circle at 50% 50%, #fef3e8 0%, #fceee9 100%);
    }

    #treeCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .s3-text-box {
      position: absolute;
      bottom: 12vh;
      left: 5vw;
      max-width: 42vw;
      z-index: 20;
      pointer-events: none;
    }

    .s3-top-phrase {
      font-style: italic;
      color: #7a5252;
      font-size: clamp(0.7rem, 2.5vw, 0.95rem);
    }

    .s3-main-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.8rem, 6.5vw, 2.8rem);
      color: #a80038;
      line-height: 1.1;
      margin: 3px 0;
    }

    .s3-sub-phrase {
      font-size: clamp(0.65rem, 2.2vw, 0.85rem);
      color: #8b5d5d;
      letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- STAGE 1: ARCHERY -->
  <div id="stage1" class="stage">
    <div class="subtitle-top">a little something, for you</div>

    <div class="target-container" id="targetBox">
      <div class="target-aura"></div>
      <svg class="main-heart-target" id="heartTarget" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff3385" />
            <stop offset="100%" stop-color="#b30047" />
          </linearGradient>
        </defs>
        <path d="M 50,30 C 60,10 90,15 90,40 C 90,65 50,90 50,90 C 50,90 10,65 10,40 C 10,15 40,10 50,30 Z" fill="url(#heartGrad)"/>
      </svg>
    </div>

    <div class="archery-interactive" id="archeryBox">
      <svg width="100%" height="100%" viewBox="0 0 200 220" style="overflow: visible;">
        <!-- Bow Limbs -->
        <path id="bowLimb" d="M 30 170 Q 100 130 170 170" fill="none" stroke="#5c3a21" stroke-width="6" stroke-linecap="round"/>
        <path d="M 30 170 Q 100 130 170 170" fill="none" stroke="#8d5b36" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Bow String -->
        <path id="bowString" d="M 30 170 Q 100 170 170 170" fill="none" stroke="#ffffff" stroke-width="2"/>
        
        <!-- Arrow -->
        <g id="arrowGroup" transform="translate(0, 0)">
          <line x1="100" y1="170" x2="100" y2="90" stroke="#d4af37" stroke-width="3.5"/>
          <path d="M 100 78 C 94 70 85 75 85 82 C 85 90 100 100 100 100 C 100 100 115 90 115 82 C 115 75 106 70 100 78 Z" fill="#e6005c"/>
          <polygon points="95,165 100,170 95,175" fill="#d4af37"/>
          <polygon points="105,165 100,170 105,175" fill="#d4af37"/>
        </g>
      </svg>
    </div>

    <div class="instruction-bottom">
      <div class="pull-text">Pull &amp; Release</div>
      <div class="action-text">Aim for the heart</div>
    </div>
  </div>

  <!-- STAGE 2: HAPPY BIRTHDAY BANNER -->
  <div id="stage2" class="stage hidden">
    <div class="s2-content">
      <div class="s2-wish">make a wish...</div>
      <div class="s2-title">Happy<br>Birthday, my love</div>
      <div class="s2-divider"></div>
      <div class="s2-subtext">to someone worth celebrating</div>
      <button class="btn-next" id="btnNext">Wanna see something more?</button>
    </div>
  </div>

  <!-- STAGE 3: BLOOMING TREE -->
  <div id="stage3" class="stage hidden">
    <canvas id="treeCanvas"></canvas>
    <div class="s3-text-box">
      <div class="s3-top-phrase">and... make it count</div>
      <div class="s3-main-title">Happy Birthday</div>
      <div class="s3-sub-phrase">here's to a year that blooms</div>
    </div>
  </div>

  <script>
    // AUDIO SYNTHESIZER
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playPullSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playReleaseSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playImpactSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function playChimeSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.08);
        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.4);
      });
    }

    function playBloomPop() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 800 + Math.random() * 400;
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // ARCHERY MECHANICS
    const archeryBox = document.getElementById('archeryBox');
    const bowString = document.getElementById('bowString');
    const arrowGroup = document.getElementById('arrowGroup');
    const targetBox = document.getElementById('targetBox');
    
    let isDragging = false;
    let startY = 0;
    let pullDistance = 0;
    const maxPull = 70;

    archeryBox.addEventListener('pointerdown', (e) => {
      initAudio();
      isDragging = true;
      startY = e.clientY;
      archeryBox.setPointerCapture(e.pointerId);
      playPullSound();
    });

    archeryBox.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaY = e.clientY - startY;
      pullDistance = Math.max(0, Math.min(deltaY, maxPull));
      
      const stringY = 170 + pullDistance;
      bowString.setAttribute('d', `M 30 170 Q 100 ${stringY} 170 170`);
      arrowGroup.setAttribute('transform', `translate(0, ${pullDistance})`);
    });

    archeryBox.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;

      if (pullDistance > 30) {
        playReleaseSound();
        shootArrow();
      } else {
        bowString.setAttribute('d', `M 30 170 Q 100 170 170 170`);
        arrowGroup.setAttribute('transform', `translate(0, 0)`);
      }
      pullDistance = 0;
    });

    function shootArrow() {
      let flightY = pullDistance;
      const targetRect = targetBox.getBoundingClientRect();
      const archeryRect = archeryBox.getBoundingClientRect();
      const hitThresholdY = -(archeryRect.top - targetRect.top);

      const flightInterval = setInterval(() => {
        flightY -= 32;
        arrowGroup.setAttribute('transform', `translate(0, ${flightY})`);
        bowString.setAttribute('d', `M 30 170 Q 100 165 170 170`);

        if (flightY <= hitThresholdY + 40) {
          clearInterval(flightInterval);
          arrowGroup.style.display = 'none';
          playImpactSound();
          dropHeartDirectly();
        }
      }, 16);
    }

    // DIRECT FALLING HEART TRANSITION
    function dropHeartDirectly() {
      let posY = targetBox.offsetTop;
      const windowHeight = window.innerHeight;
      let velocity = 2;
      let rotation = 0;

      const dropInterval = setInterval(() => {
        velocity += 1.2;
        posY += velocity;
        rotation += 2.5;

        targetBox.style.top = `${posY}px`;
        targetBox.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;

        if (posY >= windowHeight + 100) {
          clearInterval(dropInterval);
          document.getElementById('stage1').classList.add('hidden');
          document.getElementById('stage2').classList.remove('hidden');
          playChimeSound();
        }
      }, 16);
    }

    // STAGE 2 TO STAGE 3 TRANSITION
    document.getElementById('btnNext').addEventListener('click', () => {
      initAudio();
      playChimeSound();
      document.getElementById('stage2').classList.add('hidden');
      document.getElementById('stage3').classList.remove('hidden');
      initTreeAnimation();
    });

    // CANVASTREE ANIMATION (FIXED FULL HEARTS & MOBILE SCALING)
    function initTreeAnimation() {
      const canvas = document.getElementById('treeCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const startX = canvas.width / 2;
      const startY = canvas.height;
      // Scaled trunk height to ensure tree stays completely inside mobile screen
      const trunkHeight = canvas.height * 0.32;

      let currentTrunkHeight = 0;
      let branchProgress = 0;
      let bloomProgress = 0;

      const heartPoints = [];
      const totalHearts = 350;

      // Scale factor dynamically adjusted for mobile viewports
      const scale = Math.min(canvas.width * 0.022, canvas.height * 0.013);

      for (let i = 0; i < totalHearts; i++) {
        const t = Math.PI * 2 * Math.random();
        const r = Math.sqrt(Math.random());
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        
        heartPoints.push({
          x: startX + (x * scale * r),
          y: (canvas.height - trunkHeight - (scale * 12)) + (y * scale * r),
          color: ['#e6005c', '#ff4d88', '#ff80ab', '#d4af37', '#b30047'][Math.floor(Math.random() * 5)],
          size: 5 + Math.random() * 7,
          scale: 0
        });
      }

      // Symmetrical full-heart renderer centered at (0,0)
      function drawFullHeart(ctx, x, y, size, color, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.fillStyle = color;
        ctx.beginPath();
        
        ctx.moveTo(0, size * 0.35);
        ctx.bezierCurveTo(-size * 0.5, 0, -size * 0.5, -size * 0.5, 0, -size * 0.2);
        ctx.bezierCurveTo(size * 0.5, -size * 0.5, size * 0.5, 0, 0, size * 0.35);
        
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawBranchStructure(x, y, length, angle, strokeWidth) {
        ctx.save();
        ctx.beginPath();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -length);
        ctx.strokeStyle = '#3d2314';
        ctx.lineWidth = strokeWidth;
        ctx.lineCap = 'round';
        ctx.stroke();

        if (length > 18) {
          drawBranchStructure(0, -length, length * 0.72, Math.PI / 6, strokeWidth * 0.7);
          drawBranchStructure(0, -length, length * 0.72, -Math.PI / 6, strokeWidth * 0.7);
        }
        ctx.restore();
      }

      function renderFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Trunk Growth
        if (currentTrunkHeight < trunkHeight) {
          currentTrunkHeight += 4;
        }

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX, startY - currentTrunkHeight);
        ctx.strokeStyle = '#3d2314';
        ctx.lineWidth = Math.min(7, canvas.width * 0.015);
        ctx.stroke();

        // Branch Growth scaled to fit canvas width
        if (currentTrunkHeight >= trunkHeight) {
          if (branchProgress < 1) branchProgress += 0.02;

          const topY = startY - trunkHeight;
          const maxBranchLen = Math.min(70, canvas.width * 0.18);
          const leftAngle = -Math.PI / 4 * branchProgress;
          const rightAngle = Math.PI / 4 * branchProgress;

          drawBranchStructure(startX, topY, maxBranchLen * branchProgress, leftAngle, 4.5);
          drawBranchStructure(startX, topY, maxBranchLen * branchProgress, rightAngle, 4.5);
        }

        // Heart Blooming
        if (branchProgress >= 0.8) {
          heartPoints.forEach((p, idx) => {
            if (idx / totalHearts <= bloomProgress) {
              if (p.scale === 0) playBloomPop();
              if (p.scale < 1) p.scale += 0.08;
            }
            if (p.scale > 0) {
              drawFullHeart(ctx, p.x, p.y, p.size, p.color, Math.min(1, p.scale));
            }
          });

          if (bloomProgress < 1) bloomProgress += 0.01;
        }

        requestAnimationFrame(renderFrame);
      }

      renderFrame();
    }
  </script>
</body>
</html>
